plugins {
    id 'me.champeau.jmh' version '0.7.3'
    id 'org.graalvm.buildtools.native' version '0.10.6'
}

group = 'org.zuri'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.graalvm.truffle:truffle-tck:25.0.0'

    implementation 'org.graalvm.truffle:truffle-api:25.0.0'
    implementation 'org.graalvm.polyglot:polyglot:25.0.0'
    implementation 'org.graalvm.truffle:truffle-runtime:25.0.0'
    implementation 'org.graalvm.polyglot:inspect:25.0.0'
    implementation 'org.graalvm.regex:regex:25.0.0'

    annotationProcessor 'org.graalvm.truffle:truffle-dsl-processor:25.0.0'

    jmh 'org.openjdk.jmh:jmh-core:1.36'
    jmh 'org.openjdk.jmh:jmh-generator-annprocess:1.36'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.36'
    jmhRuntimeOnly 'org.graalvm.truffle:truffle-sl:25.0.0'
    jmhRuntimeOnly 'org.graalvm.polyglot:polyglot:25.0.0'
    jmhRuntimeOnly 'org.graalvm.js:js:25.0.0'
}

test {
//    useJUnitPlatform()
    jvmArgs = ['--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow']
}

tasks.named('jar').configure {
    copy {
        from configurations.runtimeClasspath
        from project.layout.buildDirectory.dir("libs/${project.name}-${project.version}.jar")
        into project.layout.buildDirectory.dir('modules')
    }
}

tasks.named('build').configure {
    copy {
        from project.layout.projectDirectory.dir('libs')
        into project.layout.buildDirectory.dir('modules/libs')
    }
}

tasks.named('nativeCompile').configure {
    copy {
        from project.layout.projectDirectory.dir('libs')
        into project.layout.buildDirectory.dir('native/nativeCompile/libs')
    }
}

graalvmNative {
    binaries.configureEach {
        // common options
        it.verbose = true
        it.resources.autodetect()
        jvmArgs = ['--sun-misc-unsafe-memory-access=allow']
    }

    binaries.main {
        // options to configure the main binary
        imageName = 'zuri'
        mainClass = 'org.zuri.Main'

        fallback = true

        buildArgs.add('-O3')
        buildArgs.add('-march=native')
        buildArgs.add('-H:+AddAllCharsets')
        buildArgs.add('-H:MaxRuntimeCompileMethods=5400')
        buildArgs.add('-H:+UnlockExperimentalVMOptions')
        buildArgs.add('--initialize-at-build-time=org.zuri')
        buildArgs.add('--enable-native-access=org.graalvm.truffle')
        buildArgs.add('--enable-native-access=org.graalvm.polyglot')
        buildArgs.add('-Dpolyglot.image-build-time.PreinitializeContexts=zuri')
    }

    binaries.test {
        // options to configure the test binary
        quickBuild = true
        debug = true
    }
}